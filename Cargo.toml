[package]
name = "automated"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
eframe = "0.29"
egui = "0.29"
serde = { version = "1", features = ["derive"] }
webbrowser = "1"
dotenvy = "0.15"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_System_Threading"] }
